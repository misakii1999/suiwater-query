<!doctype html>
<html lang="zh-CN">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>穗水表身号查询系统</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>

        /* =====================================================
           顶部右侧
        ====================================================== */

        .header-right{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:12px;
        }


        /* =====================================================
           API 状态
        ====================================================== */

        .server-status{
            display:flex;
            align-items:center;
            gap:8px;
            white-space:nowrap;
        }


        #serverStatus{
            color:#16a34a;
            font-size:13px;
            font-weight:500;
            white-space:nowrap;
        }


        /* =====================================================
           数据库数量
        ====================================================== */

        .db-status{
            margin-left:2px;
            white-space:nowrap;
            color:#16a34a;
            font-size:13px;
            font-weight:500;
        }


        /* =====================================================
           退出登录
        ====================================================== */

        .logout{
            height:36px;
            padding:0 14px;
            border:1px solid #d8e0ea;
            border-radius:8px;
            background:#fff;
            color:#374151;
            font-size:13px;
            cursor:pointer;
            transition:.18s;
            white-space:nowrap;
        }


        .logout:hover{
            background:#f8fafc;
            transform:translateY(-1px);
        }


        .logout:active{
            transform:translateY(0);
        }


        /* =====================================================
           手机端
        ====================================================== */

        @media(max-width:760px){

            .header{
                align-items:flex-start;
            }

            .header-right{
                width:100%;
                justify-content:flex-start;
                flex-wrap:wrap;
                gap:8px 10px;
            }

            .server-status{
                flex-wrap:wrap;
            }

        }

    </style>

</head>


<body>


<div class="wrap">


    <!-- =====================================================
         顶部
    ====================================================== -->

    <div class="card header">


        <!-- 左侧 Logo + 标题 -->

        <div class="logo-area">

            <div class="logo">
                💧
            </div>


            <div class="title">

                <h1>
                    穗水表身号查询系统
                </h1>


                <div class="sub">
                    表身号 / IMEI 统一查询 · 精确 · 模糊 · 批量
                </div>

            </div>

        </div>



        <!-- =================================================
             右侧 API 状态 + 数据库 + 退出登录
        ================================================== -->

        <div class="header-right">


            <div class="server-status">


                <span
                    class="server-dot"
                    id="serverDot"
                ></span>


                <span id="serverStatus">
                    API 服务检查中...
                </span>


                <span
                    class="db-status"
                    id="dbStatus"
                >
                    数据库：检查中...
                </span>


            </div>



            <button
                class="logout"
                id="logoutBtn"
                type="button"
            >
                退出登录
            </button>


        </div>


    </div>



    <!-- =====================================================
         查询区域
    ====================================================== -->

    <div class="card search-card">


        <div class="section-title">

            <h3>
                统一查询
            </h3>


            <span>
                支持批量查询
            </span>

        </div>



        <!-- 查询输入框 -->

        <textarea
            id="q"
            placeholder="请输入表身号或 IMEI

支持 Excel 一列直接粘贴；
多个号码可使用换行、空格、逗号、分号分隔。"
        ></textarea>



        <div class="tip">

            精确查询自动判断表身号或 IMEI；
            开启模糊查询后，将同时搜索表身号和 IMEI。

        </div>



        <!-- =================================================
             控制栏
        ================================================== -->

        <div class="toolbar">


            <div class="options">


                <!-- 模糊查询 -->

                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="fuzzy"
                    >

                    <span>
                        开启模糊查询
                    </span>

                </label>



                <!-- 返回数量 -->

                <div class="limit-box">

                    <span>
                        最多返回
                    </span>


                    <select
                        class="limit"
                        id="limit"
                    >

                        <option value="50">
                            50
                        </option>


                        <option value="100">
                            100
                        </option>


                        <option
                            value="200"
                            selected
                        >
                            200
                        </option>


                        <option value="500">
                            500
                        </option>


                        <option value="1000">
                            1,000
                        </option>


                        <option value="5000">
                            5,000
                        </option>


                        <option value="10000">
                            10,000
                        </option>


                        <option value="20000">
                            20,000
                        </option>


                        <option value="50000">
                            50,000
                        </option>


                        <option value="0">
                            不限制
                        </option>

                    </select>


                    <span>
                        条
                    </span>

                </div>


            </div>



            <!-- =================================================
                 按钮
            ================================================== -->

            <div class="buttons">


                <button
                    class="btn-primary"
                    id="searchBtn"
                    type="button"
                >
                    🔍 查询
                </button>


                <button
                    class="btn-normal"
                    id="clearBtn"
                    type="button"
                >
                    清空
                </button>


                <button
                    class="btn-normal"
                    id="copyBtn"
                    type="button"
                >
                    复制结果
                </button>


                <button
                    class="btn-green"
                    id="exportBtn"
                    type="button"
                >
                    导出 Excel
                </button>


            </div>


        </div>



        <!-- =================================================
             查询状态
        ================================================== -->

        <div class="status-bar">

            <span
                class="status-icon"
                id="statusIcon"
            ></span>


            <span id="status">
                就绪
            </span>

        </div>


    </div>



    <!-- =====================================================
         统计
    ====================================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                查询结果
            </div>


            <div
                class="num"
                id="t"
            >
                0
            </div>

        </div>



        <div class="stat">

            <div class="stat-label">
                查询成功
            </div>


            <div
                class="num"
                id="f"
            >
                0
            </div>

        </div>



        <div class="stat">

            <div class="stat-label">
                未找到
            </div>


            <div
                class="num"
                id="n"
            >
                0
            </div>

        </div>


    </div>



    <!-- =====================================================
         查询结果
    ====================================================== -->

    <div class="card result-card">


        <div class="result-head">


            <h3>
                查询结果
            </h3>


            <div
                class="result-info"
                id="resultInfo"
            >
                暂无数据
            </div>


        </div>



        <div
            class="scroll"
            id="r"
        >


            <div class="empty">


                <div class="empty-icon">
                    🔎
                </div>


                <div>
                    暂无查询结果
                </div>


            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   API 配置
========================================================= */

const API_BASE =
    "https://sg.oixvideos.top";



/* =========================================================
   Token
========================================================= */

let token =
    sessionStorage.getItem(
        "suiwater_token"
    );



/* =========================================================
   未登录
========================================================= */

if (!token) {

    location.replace(
        "index.html"
    );

}



/* =========================================================
   当前查询结果
========================================================= */

let rows = [];



/* =========================================================
   DOM
========================================================= */

const q =
    document.getElementById("q");


const fuzzy =
    document.getElementById("fuzzy");


const limit =
    document.getElementById("limit");


const searchBtn =
    document.getElementById("searchBtn");


const clearBtn =
    document.getElementById("clearBtn");


const copyBtn =
    document.getElementById("copyBtn");


const exportBtn =
    document.getElementById("exportBtn");


const logoutBtn =
    document.getElementById("logoutBtn");


const status =
    document.getElementById("status");


const statusIcon =
    document.getElementById("statusIcon");


const resultBox =
    document.getElementById("r");


const resultInfo =
    document.getElementById("resultInfo");


const serverStatus =
    document.getElementById("serverStatus");


const serverDot =
    document.getElementById("serverDot");


const dbStatus =
    document.getElementById("dbStatus");



/* =========================================================
   HTML 转义
========================================================= */

function esc(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;

}



/* =========================================================
   查询状态
========================================================= */

function setStatus(
    text,
    loading = false
) {

    status.textContent =
        text;


    if (loading) {

        statusIcon.style.background =
            "#f59e0b";

    } else {

        statusIcon.style.background =
            "#22c55e";

    }

}



/* =========================================================
   API 请求
========================================================= */

async function apiFetch(
    url,
    options = {}
) {


    token =
        sessionStorage.getItem(
            "suiwater_token"
        );


    if (!token) {

        location.replace(
            "index.html"
        );


        throw new Error(
            "未登录"
        );

    }



    const headers = {

        ...(options.headers || {}),

        "Authorization":
            "Bearer " + token

    };



    const response =
        await fetch(
            API_BASE + url,
            {
                ...options,
                headers
            }
        );



    /* =====================================================
       Token 失效
    ====================================================== */

    if (
        response.status === 401
    ) {

        sessionStorage.removeItem(
            "suiwater_token"
        );


        alert(
            "登录已过期，请重新登录"
        );


        location.replace(
            "index.html"
        );


        throw new Error(
            "未登录或登录已过期"
        );

    }


    return response;

}



/* =========================================================
   查询
========================================================= */

async function searchData() {


    const text =
        q.value.trim();



    if (!text) {

        setStatus(
            "请输入表身号或 IMEI"
        );


        q.focus();


        return;

    }



    searchBtn.disabled =
        true;


    searchBtn.textContent =
        "⏳ 查询中...";


    setStatus(
        "正在查询，请稍候...",
        true
    );



    try {


        /*
         * limit：
         *
         * 50     = 最多50条
         * 100    = 最多100条
         * 200    = 最多200条
         * ...
         * 50000  = 最多50000条
         * 0      = 不限制
         */

        const selectedLimit =
            Number(limit.value);



        const response =
            await apiFetch(
                "/api/search",
                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            query:
                                text,


                            fuzzy:
                                fuzzy.checked,


                            limit:
                                Number.isFinite(
                                    selectedLimit
                                )
                                    ? selectedLimit
                                    : 200

                        })

                }
            );



        let data = {};



        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "服务器返回数据异常"
            );

        }



        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }



        rows =
            Array.isArray(
                data.results
            )
                ? data.results
                : [];



        /* =================================================
           查询统计
        ================================================== */

        document
            .getElementById("t")
            .textContent =
            data.total ??
            rows.length;



        document
            .getElementById("f")
            .textContent =
            data.found ??
            rows.filter(
                x =>
                    x.status === "已找到"
            ).length;



        document
            .getElementById("n")
            .textContent =
            data.not_found ??
            rows.filter(
                x =>
                    x.status !== "已找到"
            ).length;



        render();



        setStatus(
            "查询完成，共 " +
            rows.length +
            " 条"
        );



    } catch (e) {


        console.error(
            "查询错误：",
            e
        );



        if (
            e.message !==
            "未登录或登录已过期"
        ) {

            setStatus(
                "查询失败：" +
                e.message
            );

        }


    } finally {


        searchBtn.disabled =
            false;


        searchBtn.textContent =
            "🔍 查询";

    }

}



/* =========================================================
   渲染结果
========================================================= */

function render() {


    if (!rows.length) {

        resultBox.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        `;


        resultInfo.textContent =
            "暂无数据";


        return;

    }



    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        序号
                    </th>

                    <th>
                        查询类型
                    </th>

                    <th>
                        表身号
                    </th>

                    <th>
                        IMEI
                    </th>

                    <th>
                        厂家归属
                    </th>

                    <th>
                        状态
                    </th>

                </tr>

            </thead>

            <tbody>

    `;



    rows.forEach(
        (x, i) => {


            const queryType =
                x.query_type ??
                "";


            const meterNo =
                x.meter_no ??
                "";


            const imei =
                x.imei ??
                "";


            const owner =
                x.owner ??
                "-";


            const itemStatus =
                x.status ??
                "未找到";


            const statusClass =
                itemStatus === "已找到"
                    ? "ok"
                    : "no";



            html += `

                <tr>

                    <td>
                        ${i + 1}
                    </td>

                    <td>
                        ${esc(queryType)}
                    </td>

                    <td>
                        ${esc(meterNo)}
                    </td>

                    <td>
                        ${esc(imei)}
                    </td>

                    <td>
                        ${esc(owner)}
                    </td>

                    <td
                        class="${statusClass}"
                    >
                        ${esc(itemStatus)}
                    </td>

                </tr>

            `;

        }
    );



    html += `

            </tbody>

        </table>

    `;



    resultBox.innerHTML =
        html;



    resultInfo.textContent =
        "共 " +
        rows.length +
        " 条";

}



/* =========================================================
   清空
========================================================= */

function clearAll() {


    q.value =
        "";


    rows =
        [];



    document
        .getElementById("t")
        .textContent =
        "0";


    document
        .getElementById("f")
        .textContent =
        "0";


    document
        .getElementById("n")
        .textContent =
        "0";



    resultBox.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <div>
                暂无查询结果
            </div>

        </div>

    `;



    resultInfo.textContent =
        "暂无数据";



    setStatus(
        "就绪"
    );

}



/* =========================================================
   复制结果
========================================================= */

async function copyResults() {


    if (!rows.length) {

        setStatus(
            "没有查询结果"
        );


        return;

    }



    const header =
        "序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态";



    const text =
        [

            header,

            ...rows.map(
                (x, i) => {

                    return [

                        i + 1,

                        x.query_type ??
                            "",

                        x.meter_no ??
                            "",

                        x.imei ??
                            "",

                        x.owner ??
                            "",

                        x.status ??
                            ""

                    ].join("\t");

                }
            )

        ].join("\n");



    try {


        await navigator
            .clipboard
            .writeText(text);



        setStatus(
            "查询结果已复制到剪贴板"
        );



    } catch (e) {


        console.error(e);


        setStatus(
            "复制失败，请检查浏览器剪贴板权限"
        );

    }

}



/* =========================================================
   Excel 导出
========================================================= */

async function exportExcel() {


    if (!rows.length) {

        setStatus(
            "没有可导出的数据"
        );


        return;

    }



    exportBtn.disabled =
        true;


    exportBtn.textContent =
        "⏳ 导出中...";


    setStatus(
        "正在生成 Excel，请稍候...",
        true
    );



    try {


        const response =
            await apiFetch(
                "/api/export",
                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            results:
                                rows

                        })

                }
            );



        if (!response.ok) {


            let data = {};



            try {

                data =
                    await response.json();

            } catch {}



            throw new Error(
                data.message ||
                "导出失败"
            );

        }



        const blob =
            await response.blob();



        const url =
            URL.createObjectURL(
                blob
            );



        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "穗水表身号查询结果.xlsx";



        document.body.appendChild(
            a
        );


        a.click();


        a.remove();



        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );



        setStatus(
            "Excel 导出完成"
        );



    } catch (e) {


        console.error(e);



        if (
            e.message !==
            "未登录或登录已过期"
        ) {

            setStatus(
                "导出失败：" +
                e.message
            );

        }


    } finally {


        exportBtn.disabled =
            false;


        exportBtn.textContent =
            "导出 Excel";

    }

}



/* =========================================================
   退出登录
========================================================= */

function logout() {


    sessionStorage.removeItem(
        "suiwater_token"
    );


    location.replace(
        "index.html"
    );

}



/* =========================================================
   API 健康检查
   同时获取数据库数量
========================================================= */

async function checkAPI() {


    try {


        const response =
            await fetch(
                API_BASE +
                "/api/health",
                {

                    method:
                        "GET",

                    cache:
                        "no-store"

                }
            );



        let data = {};



        try {

            data =
                await response.json();

        } catch {

            data = {};

        }



        /* =================================================
           API 正常
        ================================================== */

        if (
            response.ok &&
            data.success
        ) {


            serverStatus.textContent =
                "API 服务正常";


            serverDot.style.background =
                "#22c55e";



            /* =================================================
               数据库数量
            ================================================== */

            const records =
                Number(
                    data.records
                );



            if (
                Number.isFinite(
                    records
                )
            ) {


                dbStatus.textContent =
                    "数据库：" +
                    records.toLocaleString(
                        "zh-CN"
                    ) +
                    " 条";


            } else {


                dbStatus.textContent =
                    "数据库：未知";

            }



        } else {


            serverStatus.textContent =
                "API 服务异常";


            serverDot.style.background =
                "#ef4444";


            dbStatus.textContent =
                "数据库：无法获取";

        }



    } catch (e) {


        console.error(
            "API 健康检查失败：",
            e
        );



        serverStatus.textContent =
            "API 无法连接";


        serverDot.style.background =
            "#ef4444";


        dbStatus.textContent =
            "数据库：无法获取";

    }

}



/* =========================================================
   登录状态检查
========================================================= */

async function checkLogin() {


    try {


        const response =
            await apiFetch(
                "/api/auth/check",
                {
                    method:
                        "GET"
                }
            );



        if (!response.ok) {

            throw new Error(
                "登录状态无效"
            );

        }



    } catch (e) {


        console.error(
            "登录检查失败：",
            e
        );

    }

}



/* =========================================================
   Ctrl + Enter 查询
========================================================= */

q.addEventListener(
    "keydown",
    function(e) {


        if (
            e.ctrlKey &&
            e.key === "Enter"
        ) {


            e.preventDefault();


            searchData();

        }

    }
);



/* =========================================================
   按钮事件
========================================================= */

searchBtn.addEventListener(
    "click",
    searchData
);


clearBtn.addEventListener(
    "click",
    clearAll
);


copyBtn.addEventListener(
    "click",
    copyResults
);


exportBtn.addEventListener(
    "click",
    exportExcel
);


logoutBtn.addEventListener(
    "click",
    logout
);



/* =========================================================
   初始化
========================================================= */

checkAPI();

checkLogin();


</script>


</body>

</html>
