<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>穗水表身号查询系统</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="wrap">

    <!-- =========================
         顶部
    ========================== -->

    <div class="card header">

        <div class="logo-area">

            <div class="logo">
                💧
            </div>

            <div class="title">

                <h1>穗水表身号查询系统</h1>

                <div class="sub">
                    表身号 / IMEI 统一查询 · 精确 · 模糊 · 批量
                </div>

            </div>

        </div>


        <div class="server-status">

            <span class="server-dot"></span>

            <span id="apiStatus">
                API 服务正常
            </span>

        </div>

    </div>


    <!-- =========================
         查询区域
    ========================== -->

    <div class="card search-card">

        <div class="section-title">

            <h3>
                统一查询
            </h3>

            <span>
                支持批量查询
            </span>

        </div>


        <!-- 输入框 -->

        <textarea
            id="q"
            placeholder="请输入表身号或 IMEI

支持 Excel 一列直接粘贴；
多个号码可使用换行、空格、逗号、分号分隔。"
        ></textarea>


        <!-- 提示 -->

        <div class="tip">

            精确查询自动判断表身号或 IMEI；
            开启模糊查询后，将同时搜索表身号和 IMEI。

        </div>


        <!-- =========================
             控制栏
        ========================== -->

        <div class="toolbar">


            <!-- 左侧选项 -->

            <div class="options">

                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="fuzzy"
                    >

                    <span>
                        开启模糊查询
                    </span>

                </label>


                <div class="limit-box">

                    <span>
                        最多返回
                    </span>

                    <input
                        class="limit"
                        id="limit"
                        type="number"
                        min="1"
                        max="1000"
                        value="200"
                    >

                    <span>
                        条
                    </span>

                </div>

            </div>


            <!-- 右侧按钮 -->

            <div class="buttons">

                <button
                    type="button"
                    class="btn-primary"
                    id="searchBtn"
                    onclick="searchData()"
                >
                    🔍 查询
                </button>


                <button
                    type="button"
                    class="btn-normal"
                    onclick="clearAll()"
                >
                    清空
                </button>


                <button
                    type="button"
                    class="btn-normal"
                    onclick="copyResults()"
                >
                    复制结果
                </button>


                <button
                    type="button"
                    class="btn-green"
                    id="exportBtn"
                    onclick="exportExcel()"
                >
                    导出 Excel
                </button>

            </div>

        </div>


        <!-- =========================
             查询状态
        ========================== -->

        <div class="status-bar">

            <span
                class="status-icon"
                id="statusIcon"
            ></span>

            <span id="status">
                就绪
            </span>

        </div>

    </div>


    <!-- =========================
         统计
    ========================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                查询结果
            </div>

            <div
                class="num"
                id="t"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                查询成功
            </div>

            <div
                class="num"
                id="f"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                未找到
            </div>

            <div
                class="num"
                id="n"
            >
                0
            </div>

        </div>

    </div>


    <!-- =========================
         查询结果
    ========================== -->

    <div class="card result-card">


        <div class="result-head">

            <h3>
                查询结果
            </h3>


            <div
                class="result-info"
                id="resultInfo"
            >
                暂无数据
            </div>

        </div>


        <div
            class="scroll"
            id="r"
        >

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   API 配置
========================================================= */

const API_BASE =
    "https://sg.oixvideos.top";

const API_KEY =
    "SuiWater-8925-02147039-89";


/* 当前结果 */

let rows = [];


/* =========================================================
   HTML 转义
========================================================= */

const esc = x => {

    let d =
        document.createElement("div");

    d.textContent =
        x ?? "";

    return d.innerHTML;

};


/* =========================================================
   状态
========================================================= */

function setStatus(
    text,
    loading = false
) {

    const status =
        document.getElementById("status");

    const icon =
        document.getElementById("statusIcon");


    status.textContent =
        text;


    if (loading) {

        icon.style.background =
            "#f59e0b";

    } else {

        icon.style.background =
            "#22c55e";

    }

}


/* =========================================================
   查询
========================================================= */

async function searchData() {

    const text =
        document
            .getElementById("q")
            .value
            .trim();


    if (!text) {

        alert(
            "请输入表身号或 IMEI"
        );

        return;

    }


    const fuzzy =
        document.getElementById("fuzzy");


    const limit =
        document.getElementById("limit");


    const btn =
        document.getElementById("searchBtn");


    setStatus(
        "正在查询，请稍候...",
        true
    );


    btn.disabled = true;

    btn.textContent =
        "⏳ 查询中...";


    try {

        const x =
            await fetch(

                API_BASE +
                "/api/search",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-API-Key":
                            API_KEY

                    },

                    body:
                        JSON.stringify({

                            query:
                                text,

                            fuzzy:
                                fuzzy.checked,

                            limit:
                                Math.min(

                                    Math.max(

                                        Number(
                                            limit.value
                                        ) || 200,

                                        1

                                    ),

                                    1000

                                )

                        })

                }

            );


        let d =
            await x.json();


        if (
            !x.ok ||
            !d.success
        ) {

            throw new Error(

                d.message ||
                ("HTTP " + x.status)

            );

        }


        rows =
            d.results || [];


        document
            .getElementById("t")
            .textContent =
            d.total || 0;


        document
            .getElementById("f")
            .textContent =
            d.found || 0;


        document
            .getElementById("n")
            .textContent =
            d.not_found || 0;


        render();


        setStatus(

            "查询完成，共 " +
            rows.length +
            " 条"

        );


    } catch (e) {

        console.error(e);


        setStatus(

            "查询失败：" +
            e.message

        );

    } finally {

        btn.disabled = false;

        btn.textContent =
            "🔍 查询";

    }

}


/* =========================================================
   渲染结果
========================================================= */

function render() {

    const box =
        document.getElementById("r");


    const info =
        document.getElementById(
            "resultInfo"
        );


    if (!rows.length) {

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        `;


        info.textContent =
            "暂无数据";


        return;

    }


    let h = `

        <table>

            <thead>

                <tr>

                    <th>
                        序号
                    </th>

                    <th>
                        查询类型
                    </th>

                    <th>
                        表身号
                    </th>

                    <th>
                        IMEI
                    </th>

                    <th>
                        厂家归属
                    </th>

                    <th>
                        状态
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach(
        (x, i) => {

            h += `

                <tr>

                    <td>
                        ${i + 1}
                    </td>

                    <td>
                        ${esc(
                            x.query_type
                        )}
                    </td>

                    <td>
                        ${esc(
                            x.meter_no
                        )}
                    </td>

                    <td>
                        ${esc(
                            x.imei
                        )}
                    </td>

                    <td>
                        ${esc(
                            x.owner || "-"
                        )}
                    </td>

                    <td class="${
                        x.status ===
                        "已找到"
                            ? "ok"
                            : "no"
                    }">

                        ${esc(
                            x.status
                        )}

                    </td>

                </tr>

            `;

        }
    );


    h += `

            </tbody>

        </table>

    `;


    box.innerHTML =
        h;


    info.textContent =
        "共 " +
        rows.length +
        " 条";

}


/* =========================================================
   清空
========================================================= */

function clearAll() {

    document
        .getElementById("q")
        .value = "";


    rows = [];


    document
        .getElementById("t")
        .textContent =
        "0";


    document
        .getElementById("f")
        .textContent =
        "0";


    document
        .getElementById("n")
        .textContent =
        "0";


    document
        .getElementById("r")
        .innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        `;


    document
        .getElementById(
            "resultInfo"
        )
        .textContent =
        "暂无数据";


    setStatus(
        "就绪"
    );

}


/* =========================================================
   复制结果
========================================================= */

async function copyResults() {

    if (!rows.length) {

        alert(
            "没有查询结果"
        );

        return;

    }


    const text = [

        "序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态",

        ...rows.map(
            (x, i) =>

                `${i + 1}\t` +
                `${x.query_type || ""}\t` +
                `${x.meter_no || ""}\t` +
                `${x.imei || ""}\t` +
                `${x.owner || ""}\t` +
                `${x.status || ""}`

        )

    ].join("\n");


    try {

        await navigator
            .clipboard
            .writeText(text);


        setStatus(
            "查询结果已复制到剪贴板"
        );


    } catch (e) {

        alert(
            "复制失败，请检查浏览器剪贴板权限"
        );

    }

}


/* =========================================================
   导出 Excel
========================================================= */

async function exportExcel() {

    if (!rows.length) {

        alert(
            "没有可导出的数据"
        );

        return;

    }


    const btn =
        document.getElementById(
            "exportBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "⏳ 导出中...";


    setStatus(
        "正在生成 Excel，请稍候...",
        true
    );


    try {

        const x =
            await fetch(

                API_BASE +
                "/api/export",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-API-Key":
                            API_KEY

                    },

                    body:
                        JSON.stringify({

                            results:
                                rows

                        })

                }

            );


        if (!x.ok) {

            const d =
                await x.json()
                    .catch(
                        () => ({})
                    );


            throw new Error(

                d.message ||
                "导出失败"

            );

        }


        const b =
            await x.blob();


        const u =
            URL.createObjectURL(b);


        const a =
            document.createElement(
                "a"
            );


        a.href =
            u;


        a.download =
            "穗水表身号查询结果.xlsx";


        document
            .body
            .appendChild(a);


        a.click();


        a.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    u
                );

            },
            1000
        );


        setStatus(
            "Excel 导出完成"
        );


    } catch (e) {

        setStatus(
            "导出失败：" +
            e.message
        );


    } finally {

        btn.disabled = false;

        btn.textContent =
            "导出 Excel";

    }

}


/* =========================================================
   Ctrl + Enter 查询
========================================================= */

document
    .getElementById("q")
    .addEventListener(

        "keydown",

        e => {

            if (
                e.ctrlKey &&
                e.key === "Enter"
            ) {

                e.preventDefault();

                searchData();

            }

        }

    );


/* =========================================================
   检查 API
========================================================= */

async function checkAPI() {

    const apiStatus =
        document.getElementById(
            "apiStatus"
        );


    try {

        const x =
            await fetch(

                API_BASE +
                "/api/health",

                {
                    method: "GET"
                }

            );


        const d =
            await x.json();


        if (
            x.ok &&
            d.success
        ) {

            apiStatus.textContent =
                "API 服务正常 · 数据库 " +
                Number(
                    d.records
                ).toLocaleString() +
                " 条";


        } else {

            apiStatus.textContent =
                "API 服务异常";

        }


    } catch (e) {

        apiStatus.textContent =
            "无法连接 API 服务";

    }

}


/* =========================================================
   页面加载
========================================================= */

checkAPI();

</script>

</body>
</html>
