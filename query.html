<!doctype html>
<html lang="zh-CN">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>穗水表身号查询系统</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<div class="wrap">


    <!-- =====================================================
         顶部
    ====================================================== -->

    <div class="card header">

        <div class="logo-area">

            <div class="logo">
                💧
            </div>


            <div class="title">

                <h1>
                    穗水表身号查询系统
                </h1>

                <div class="sub">
                    表身号 / IMEI 统一查询 · 精确 · 模糊 · 批量
                </div>

            </div>

        </div>


        <div class="header-right">

            <div class="server-status">

                <span
                    class="server-dot"
                    id="serverDot"
                ></span>

                <span id="serverStatus">
                    API 服务检查中...
                </span>

            </div>


            <button
                class="logout"
                id="logoutBtn"
                type="button"
            >
                退出登录
            </button>

        </div>

    </div>



    <!-- =====================================================
         查询
    ====================================================== -->

    <div class="card search-card">


        <div class="section-title">

            <h3>
                统一查询
            </h3>

            <span>
                支持批量查询
            </span>

        </div>


        <textarea
            id="q"
            placeholder="请输入表身号或 IMEI

支持 Excel 一列直接粘贴；
多个号码可使用换行、空格、逗号、分号分隔。"
        ></textarea>


        <div class="tip">

            精确查询自动判断表身号或 IMEI；
            开启模糊查询后，将同时搜索表身号和 IMEI。

        </div>


        <!-- =================================================
             控制栏
        ================================================== -->

        <div class="toolbar">


            <div class="options">


                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="fuzzy"
                    >

                    <span>
                        开启模糊查询
                    </span>

                </label>


                <div class="limit-box">

                    <span>
                        最多返回
                    </span>


                    <input
                        class="limit"
                        id="limit"
                        type="number"
                        min="1"
                        max="1000"
                        value="200"
                    >


                    <span>
                        条
                    </span>

                </div>


            </div>



            <div class="buttons">


                <button
                    class="btn-primary"
                    id="searchBtn"
                    type="button"
                    onclick="searchData()"
                >
                    🔍 查询
                </button>


                <button
                    class="btn-normal"
                    type="button"
                    onclick="clearAll()"
                >
                    清空
                </button>


                <button
                    class="btn-normal"
                    type="button"
                    onclick="copyResults()"
                >
                    复制结果
                </button>


                <button
                    class="btn-green"
                    id="exportBtn"
                    type="button"
                    onclick="exportExcel()"
                >
                    导出 Excel
                </button>


            </div>

        </div>



        <!-- =================================================
             查询状态
        ================================================== -->

        <div class="status-bar">

            <span
                class="status-icon"
                id="statusIcon"
            ></span>

            <span id="status">
                就绪
            </span>

        </div>


    </div>



    <!-- =====================================================
         统计
    ====================================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                查询结果
            </div>

            <div
                class="num"
                id="t"
            >
                0
            </div>

        </div>



        <div class="stat">

            <div class="stat-label">
                查询成功
            </div>

            <div
                class="num"
                id="f"
            >
                0
            </div>

        </div>



        <div class="stat">

            <div class="stat-label">
                未找到
            </div>

            <div
                class="num"
                id="n"
            >
                0
            </div>

        </div>


    </div>



    <!-- =====================================================
         查询结果
    ====================================================== -->

    <div class="card result-card">


        <div class="result-head">

            <h3>
                查询结果
            </h3>

            <div
                class="result-info"
                id="resultInfo"
            >
                暂无数据
            </div>

        </div>


        <div
            class="scroll"
            id="r"
        >

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        </div>


    </div>


</div>



<script>

/* =========================================================
   API 配置
========================================================= */

const API_BASE =
    "https://sg.oixvideos.top";


/* =========================================================
   当前结果
========================================================= */

let rows = [];


/* =========================================================
   Token
========================================================= */

function getToken() {

    return sessionStorage.getItem(
        "suiwater_token"
    );

}


/* =========================================================
   检查登录
========================================================= */

async function checkLogin() {

    const token =
        getToken();


    if (!token) {

        location.replace(
            "index.html"
        );

        return false;
    }


    try {

        const response =
            await fetch(
                API_BASE + "/api/auth/check",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            sessionStorage.removeItem(
                "suiwater_token"
            );

            location.replace(
                "index.html"
            );

            return false;
        }


        return true;


    } catch (error) {

        console.error(error);

        setStatus(
            "无法连接 API 服务"
        );

        return false;

    }

}


/* =========================================================
   HTML 转义
========================================================= */

function esc(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   状态
========================================================= */

function setStatus(
    text,
    loading = false
) {

    const status =
        document.getElementById(
            "status"
        );


    const icon =
        document.getElementById(
            "statusIcon"
        );


    status.textContent =
        text;


    icon.style.background =
        loading
            ? "#f59e0b"
            : "#22c55e";

}


/* =========================================================
   API 服务状态
========================================================= */

async function checkAPI() {

    const statusText =
        document.getElementById(
            "serverStatus"
        );


    const dot =
        document.getElementById(
            "serverDot"
        );


    try {

        const response =
            await fetch(
                API_BASE + "/api/health",
                {
                    method: "GET"
                }
            );


        const data =
            await response.json()
                .catch(() => ({}));


        if (
            response.ok &&
            data.success
        ) {

            let text =
                "API 服务正常";


            if (
                data.records !==
                undefined
            ) {

                text +=
                    " · 数据库 " +
                    Number(
                        data.records
                    ).toLocaleString() +
                    " 条";

            }


            statusText.textContent =
                text;


            dot.style.background =
                "#22c55e";


        } else {

            statusText.textContent =
                "API 服务异常";

            dot.style.background =
                "#ef4444";

        }


    } catch (error) {

        console.error(error);

        statusText.textContent =
            "无法连接 API 服务";

        dot.style.background =
            "#ef4444";

    }

}


/* =========================================================
   查询
========================================================= */

async function searchData() {


    const text =
        document
            .getElementById("q")
            .value
            .trim();


    if (!text) {

        alert(
            "请输入表身号或 IMEI"
        );

        return;

    }


    const fuzzy =
        document.getElementById(
            "fuzzy"
        );


    const limitInput =
        document.getElementById(
            "limit"
        );


    const btn =
        document.getElementById(
            "searchBtn"
        );


    let limit =
        Number(
            limitInput.value
        ) || 200;


    limit =
        Math.min(
            Math.max(limit, 1),
            1000
        );


    limitInput.value =
        limit;


    const token =
        getToken();


    if (!token) {

        sessionStorage.removeItem(
            "suiwater_token"
        );

        location.replace(
            "index.html"
        );

        return;

    }


    setStatus(
        "正在查询，请稍候...",
        true
    );


    btn.disabled = true;

    btn.textContent =
        "⏳ 查询中...";


    try {


        const response =
            await fetch(
                API_BASE + "/api/search",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({

                            query:
                                text,

                            fuzzy:
                                fuzzy.checked,

                            limit:
                                limit

                        })

                }
            );


        const data =
            await response.json()
                .catch(() => ({}));


        /*
         * 登录过期
         */

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            sessionStorage.removeItem(
                "suiwater_token"
            );

            alert(
                "登录已过期，请重新登录"
            );

            location.replace(
                "index.html"
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                ("HTTP " +
                    response.status)
            );

        }


        rows =
            data.results || [];


        document.getElementById(
            "t"
        ).textContent =
            data.total ??
            rows.length;


        document.getElementById(
            "f"
        ).textContent =
            data.found ??
            rows.filter(
                x =>
                    x.status ===
                    "已找到"
            ).length;


        document.getElementById(
            "n"
        ).textContent =
            data.not_found ??
            Math.max(
                0,
                (
                    data.total ??
                    0
                ) -
                (
                    data.found ??
                    0
                )
            );


        render();


        setStatus(
            "查询完成，共 " +
            rows.length +
            " 条"
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "查询失败：" +
            error.message
        );


    } finally {

        btn.disabled = false;

        btn.textContent =
            "🔍 查询";

    }

}


/* =========================================================
   渲染
========================================================= */

function render() {


    const box =
        document.getElementById(
            "r"
        );


    const info =
        document.getElementById(
            "resultInfo"
        );


    if (!rows.length) {

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div>
                    暂无查询结果
                </div>

            </div>

        `;


        info.textContent =
            "暂无数据";


        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>序号</th>

                    <th>查询类型</th>

                    <th>表身号</th>

                    <th>IMEI</th>

                    <th>厂家归属</th>

                    <th>状态</th>

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach(
        (x, i) => {


            const queryType =
                x.query_type ??
                x["查询类型"] ??
                "";


            const meterNo =
                x.meter_no ??
                x["表身号"] ??
                "";


            const imei =
                x.imei ??
                x["IMEI"] ??
                "";


            const owner =
                x.owner ??
                x.factory ??
                x["厂家归属"] ??
                "-";


            const status =
                x.status ??
                x["状态"] ??
                "";


            html += `

                <tr>

                    <td>
                        ${i + 1}
                    </td>

                    <td>
                        ${esc(queryType)}
                    </td>

                    <td>
                        ${esc(meterNo)}
                    </td>

                    <td>
                        ${esc(imei)}
                    </td>

                    <td>
                        ${esc(owner)}
                    </td>

                    <td class="${
                        status === "已找到"
                            ? "ok"
                            : "no"
                    }">

                        ${esc(
                            status ||
                            "未找到"
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML =
        html;


    info.textContent =
        "共 " +
        rows.length +
        " 条";

}


/* =========================================================
   清空
========================================================= */

function clearAll() {


    document.getElementById(
        "q"
    ).value = "";


    rows = [];


    document.getElementById(
        "t"
    ).textContent = "0";


    document.getElementById(
        "f"
    ).textContent = "0";


    document.getElementById(
        "n"
    ).textContent = "0";


    document.getElementById(
        "r"
    ).innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <div>
                暂无查询结果
            </div>

        </div>

    `;


    document.getElementById(
        "resultInfo"
    ).textContent =
        "暂无数据";


    setStatus(
        "就绪"
    );

}


/* =========================================================
   复制结果
========================================================= */

async function copyResults() {


    if (!rows.length) {

        alert(
            "没有查询结果"
        );

        return;

    }


    const header =
        "序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态";


    const textRows =
        rows.map(
            (x, i) => {


                const queryType =
                    x.query_type ??
                    x["查询类型"] ??
                    "";


                const meterNo =
                    x.meter_no ??
                    x["表身号"] ??
                    "";


                const imei =
                    x.imei ??
                    x["IMEI"] ??
                    "";


                const owner =
                    x.owner ??
                    x.factory ??
                    x["厂家归属"] ??
                    "";


                const status =
                    x.status ??
                    x["状态"] ??
                    "";


                return [

                    i + 1,

                    queryType,

                    meterNo,

                    imei,

                    owner,

                    status

                ].join("\t");

            }
        );


    try {

        await navigator
            .clipboard
            .writeText(
                [
                    header,
                    ...textRows
                ].join("\n")
            );


        setStatus(
            "查询结果已复制到剪贴板"
        );


    } catch (error) {

        console.error(error);

        alert(
            "复制失败，请检查浏览器剪贴板权限"
        );

    }

}


/* =========================================================
   导出 Excel
========================================================= */

async function exportExcel() {


    if (!rows.length) {

        alert(
            "没有可导出的数据"
        );

        return;

    }


    const token =
        getToken();


    if (!token) {

        sessionStorage.removeItem(
            "suiwater_token"
        );

        location.replace(
            "index.html"
        );

        return;

    }


    const btn =
        document.getElementById(
            "exportBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "⏳ 导出中...";


    setStatus(
        "正在生成 Excel，请稍候...",
        true
    );


    try {


        const response =
            await fetch(
                API_BASE +
                "/api/export",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify({
                            results: rows
                        })

                }
            );


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            sessionStorage.removeItem(
                "suiwater_token"
            );

            alert(
                "登录已过期，请重新登录"
            );

            location.replace(
                "index.html"
            );

            return;

        }


        if (!response.ok) {

            const data =
                await response.json()
                    .catch(() => ({}));


            throw new Error(
                data.message ||
                "导出失败"
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "穗水表身号查询结果.xlsx";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        setStatus(
            "Excel 导出完成"
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "导出失败：" +
            error.message
        );


    } finally {

        btn.disabled = false;

        btn.textContent =
            "导出 Excel";

    }

}


/* =========================================================
   退出登录
========================================================= */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        function () {

            sessionStorage.removeItem(
                "suiwater_token"
            );


            location.replace(
                "index.html"
            );

        }
    );


/* =========================================================
   Ctrl + Enter 查询
========================================================= */

document
    .getElementById("q")
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                searchData();

            }

        }
    );


/* =========================================================
   页面初始化
========================================================= */

(async function init() {

    const logged =
        await checkLogin();


    if (!logged) {
        return;
    }


    checkAPI();

})();

</script>


</body>
</html>
