<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>登录 - 穗水表身号查询系统</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

<div class="login-box">

    <div class="logo">
        💧
    </div>

    <h1>
        穗水表身号查询系统
    </h1>

    <div class="login-sub">
        请输入账号和密码登录
    </div>


    <form id="loginForm">

        <div class="field">

            <label for="username">
                用户名
            </label>

            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="请输入用户名"
                required
            >

        </div>


        <div class="field">

            <label for="password">
                密码
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="请输入密码"
                required
            >

        </div>


        <button
            class="login-btn"
            id="loginBtn"
            type="submit"
        >
            登录
        </button>


        <div
            class="login-error"
            id="error"
        ></div>

    </form>


    <div class="login-footer">
        穗水表身号查询系统
    </div>

</div>


<script>

/* =========================================================
   API 地址
========================================================= */

const API_BASE = "https://sg.oixvideos.top";


/* =========================================================
   已登录检查
========================================================= */

const oldToken =
    sessionStorage.getItem("suiwater_token");


if (oldToken) {

    fetch(
        API_BASE + "/api/auth/check",
        {
            method: "GET",

            headers: {
                "Authorization":
                    "Bearer " + oldToken
            }
        }
    )
    .then(response => {

        if (response.ok) {

            location.replace("query.html");

        } else {

            sessionStorage.removeItem(
                "suiwater_token"
            );

        }

    })
    .catch(() => {

        /*
         * API 暂时无法连接时，
         * 不影响登录页面显示。
         */

    });

}


/* =========================================================
   登录
========================================================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const error =
            document
            .getElementById("error");


        const btn =
            document
            .getElementById("loginBtn");


        error.textContent = "";


        if (!username || !password) {

            error.textContent =
                "请输入用户名和密码";

            return;
        }


        btn.disabled = true;

        btn.textContent =
            "⏳ 登录中...";


        try {

            const response =
                await fetch(
                    API_BASE + "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "服务器返回数据异常"
                );

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "用户名或密码错误"
                );

            }


            if (!data.token) {

                throw new Error(
                    "登录成功，但服务器没有返回 Token"
                );

            }


            /*
             * 保存登录 Token
             */

            sessionStorage.setItem(
                "suiwater_token",
                data.token
            );


            /*
             * 跳转查询页面
             */

            location.replace(
                "query.html"
            );


        } catch (e) {

            console.error(
                "登录错误：",
                e
            );


            error.textContent =
                e.message ||
                "登录失败，请检查 API 服务";


        } finally {

            btn.disabled = false;

            btn.textContent =
                "登录";

        }

    }
);

</script>

</body>
</html>
