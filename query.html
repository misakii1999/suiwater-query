<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>穗水表身号查询系统</title>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 10%,
            #e8f1ff 0,
            #f5f9ff 35%,
            #f8fbff 70%
        );

    font-family:
        "Microsoft YaHei",
        "Segoe UI",
        Arial,
        sans-serif;

    color:#1f2937;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   主容器
========================= */

.wrap{
    width:94%;
    max-width:1400px;
    margin:28px auto 45px;
}


/* =========================
   卡片
========================= */

.card{
    background:rgba(255,255,255,.96);

    border:1px solid #e7edf5;

    border-radius:16px;

    box-shadow:
        0 8px 28px rgba(31,41,55,.07);

    margin-bottom:18px;
}


/* =========================
   顶部
========================= */

.header{
    padding:22px 26px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.logo-area{
    display:flex;

    align-items:center;

    gap:15px;
}

.logo{
    width:48px;
    height:48px;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6
        );

    color:#fff;

    font-size:25px;

    box-shadow:
        0 6px 16px rgba(37,99,235,.25);
}

.title h1{
    margin:0;

    font-size:24px;

    font-weight:700;

    color:#111827;
}

.title .sub{
    margin-top:5px;

    font-size:13px;

    color:#7b8794;
}

.server-status{
    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 13px;

    border-radius:20px;

    background:#f0fdf4;

    color:#15803d;

    font-size:13px;

    white-space:nowrap;
}

.server-dot{
    width:8px;
    height:8px;

    background:#22c55e;

    border-radius:50%;
}


/* =========================
   查询区域
========================= */

.search-card{
    padding:24px 26px 22px;
}

.section-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;
}

.section-title h3{
    margin:0;

    font-size:17px;

    color:#111827;
}

.section-title span{
    font-size:12px;

    color:#9ca3af;
}


/* =========================
   输入框
========================= */

textarea{
    display:block;

    width:100%;

    height:190px;

    padding:16px 17px;

    border:1px solid #d9e1eb;

    border-radius:11px;

    background:#fbfdff;

    color:#1f2937;

    font-family:inherit;

    font-size:15px;

    line-height:1.65;

    outline:none;

    resize:vertical;

    transition:.2s;
}

textarea:focus{
    border-color:#60a5fa;

    background:#fff;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.10);
}

textarea::placeholder{
    color:#a4adba;
}


/* =========================
   提示
========================= */

.tip{
    margin-top:9px;

    color:#8a94a3;

    font-size:12px;
}


/* =========================
   控制栏
========================= */

.toolbar{
    margin-top:16px;

    padding:13px 14px;

    border:1px solid #e7ecf3;

    border-radius:11px;

    background:#f8fafc;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    flex-wrap:wrap;
}

.options{
    display:flex;

    align-items:center;

    gap:22px;

    flex-wrap:wrap;
}

.checkbox{
    display:flex;

    align-items:center;

    gap:7px;

    cursor:pointer;

    font-size:14px;

    color:#374151;
}

.checkbox input{
    width:16px;
    height:16px;

    cursor:pointer;
}

.limit-box{
    display:flex;

    align-items:center;

    gap:7px;

    font-size:14px;

    color:#4b5563;
}

.limit{
    width:72px;

    height:32px;

    padding:4px 8px;

    border:1px solid #d6dee8;

    border-radius:7px;

    background:#fff;

    text-align:center;

    outline:none;
}

.limit:focus{
    border-color:#60a5fa;
}


/* =========================
   按钮
========================= */

.buttons{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

button{
    height:36px;

    padding:0 17px;

    border:0;

    border-radius:8px;

    font-family:inherit;

    font-size:14px;

    cursor:pointer;

    transition:.18s;
}

button:hover{
    transform:translateY(-1px);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.btn-primary{
    background:#2563eb;

    color:#fff;

    box-shadow:
        0 3px 8px rgba(37,99,235,.18);
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-normal{
    background:#fff;

    border:1px solid #d8e0ea;

    color:#374151;
}

.btn-normal:hover{
    background:#f8fafc;
}

.btn-green{
    background:#16a34a;

    color:#fff;
}

.btn-green:hover{
    background:#15803d;
}


/* =========================
   状态
========================= */

.status-bar{
    min-height:24px;

    margin-top:12px;

    display:flex;

    align-items:center;

    gap:8px;

    font-size:13px;

    color:#6b7280;
}

.status-icon{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#94a3b8;

    flex:none;
}


/* =========================
   统计
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;

    margin-bottom:18px;
}

.stat{
    padding:19px 22px;

    background:#fff;

    border:1px solid #e7edf5;

    border-radius:15px;

    box-shadow:
        0 6px 22px rgba(31,41,55,.055);
}

.stat-label{
    font-size:13px;

    color:#7b8794;
}

.num{
    margin-top:5px;

    font-size:28px;

    line-height:1.2;

    font-weight:700;

    color:#111827;
}


/* =========================
   结果区域
========================= */

.result-card{
    overflow:hidden;

    margin-top:20px;
}

.result-head{
    padding:19px 24px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #edf1f5;
}

.result-head h3{
    margin:0;

    font-size:17px;
}

.result-info{
    color:#9ca3af;

    font-size:12px;
}

.scroll{
    width:100%;

    max-height:560px;

    overflow:auto;
}


/* =========================
   表格
========================= */

table{
    width:100%;

    border-collapse:collapse;

    min-width:850px;
}

th,
td{
    padding:12px 15px;

    border-bottom:1px solid #edf1f5;

    text-align:left;

    white-space:nowrap;

    font-size:13px;
}

th{
    position:sticky;

    top:0;

    z-index:2;

    background:#f7f9fc;

    color:#4b5563;

    font-weight:600;
}

tbody tr:hover{
    background:#f8fbff;
}

td{
    color:#374151;
}

.ok{
    color:#16a34a !important;

    font-weight:600;
}

.no{
    color:#dc2626 !important;

    font-weight:600;
}


/* =========================
   空状态
========================= */

.empty{
    height:240px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    color:#a0a8b4;

    font-size:14px;

    gap:9px;
}

.empty-icon{
    font-size:32px;

    opacity:.55;
}


/* =========================
   滚动条
========================= */

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:#f3f5f8;
}

::-webkit-scrollbar-thumb{
    background:#cbd5e1;

    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#94a3b8;
}


/* =========================
   手机
========================= */

@media(max-width:800px){

    .wrap{
        width:96%;

        margin-top:15px;
    }

    .header{
        padding:18px;
    }

    .server-status{
        display:none;
    }

    .title h1{
        font-size:20px;
    }

    .search-card{
        padding:18px;
    }

    textarea{
        height:170px;
    }

    .toolbar{
        align-items:stretch;

        flex-direction:column;
    }

    .buttons{
        width:100%;
    }

    button{
        flex:1;
    }

    .stats{
        grid-template-columns:1fr;

        gap:10px;
    }

    .stat{
        padding:15px 18px;
    }

    .result-head{
        padding:16px 18px;
    }
}

</style>

</head>


<body>

<div class="wrap">


<!-- =========================
     顶部
========================== -->

<div class="card header">

    <div class="logo-area">

        <div class="logo">
            💧
        </div>

        <div class="title">

            <h1>
                穗水表身号查询系统
            </h1>

            <div class="sub">
                表身号 / IMEI 统一查询 · 精确 · 模糊 · 批量
            </div>

        </div>

    </div>


    <div class="server-status">

        <span class="server-dot"></span>

        <span id="apiStatus">
            API 服务检查中...
        </span>

    </div>

</div>


<!-- =========================
     查询
========================== -->

<div class="card search-card">

    <div class="section-title">

        <h3>
            统一查询
        </h3>

        <span>
            支持批量查询
        </span>

    </div>


    <textarea
        id="q"
        placeholder="请输入表身号或 IMEI

支持 Excel 一列直接粘贴；
多个号码可使用换行、空格、逗号、分号分隔。"
    ></textarea>


    <div class="tip">

        精确查询自动判断表身号或 IMEI；
        开启模糊查询后，将同时搜索表身号和 IMEI。

    </div>


    <!-- =========================
         控制栏
    ========================== -->

    <div class="toolbar">


        <div class="options">


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="fuzzy"
                >

                <span>
                    开启模糊查询
                </span>

            </label>


            <div class="limit-box">

                <span>
                    最多返回
                </span>

                <input
                    class="limit"
                    id="limit"
                    type="number"
                    min="1"
                    max="1000"
                    value="200"
                >

                <span>
                    条
                </span>

            </div>

        </div>


        <!-- =========================
             按钮
        ========================== -->

        <div class="buttons">


            <button
                class="btn-primary"
                id="searchBtn"
                onclick="searchData()"
            >
                🔍 查询
            </button>


            <button
                class="btn-normal"
                onclick="clearAll()"
            >
                清空
            </button>


            <button
                class="btn-normal"
                onclick="copyResults()"
            >
                复制结果
            </button>


            <button
                class="btn-green"
                id="exportBtn"
                onclick="exportExcel()"
            >
                导出 Excel
            </button>


        </div>

    </div>


    <!-- =========================
         查询状态
    ========================== -->

    <div class="status-bar">

        <span
            class="status-icon"
            id="statusIcon"
        ></span>

        <span id="status">
            就绪
        </span>

    </div>

</div>


<!-- =========================
     统计
========================== -->

<div class="stats">


    <div class="stat">

        <div class="stat-label">
            查询结果
        </div>

        <div
            class="num"
            id="t"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            查询成功
        </div>

        <div
            class="num"
            id="f"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            未找到
        </div>

        <div
            class="num"
            id="n"
        >
            0
        </div>

    </div>


</div>


<!-- =========================
     查询结果
========================== -->

<div class="card result-card">


    <div class="result-head">

        <h3>
            查询结果
        </h3>

        <div
            class="result-info"
            id="resultInfo"
        >
            暂无数据
        </div>

    </div>


    <div
        class="scroll"
        id="r"
    >

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <div>
                暂无查询结果
            </div>

        </div>

    </div>

</div>


</div>


<script>

/* =========================================================
   API 配置
========================================================= */

const API_BASE = "https://sg.oixvideos.top";


/* =========================================================
   登录 Token
========================================================= */

function getToken() {
    return sessionStorage.getItem("suiwater_token");
}


/* =========================================================
   检查登录
========================================================= */

async function checkLogin() {

    const token = getToken();

    if (!token) {
        window.location.replace("index.html");
        return false;
    }

    try {

        const response = await fetch(
            API_BASE + "/api/auth/check",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        if (!response.ok) {

            sessionStorage.removeItem("suiwater_token");

            window.location.replace("index.html");

            return false;
        }

        return true;

    } catch (error) {

        console.error("登录检查失败:", error);

        return true;
    }
}


/* =========================================================
   元素
========================================================= */

const queryInput =
    document.getElementById("queryInput");

const fuzzy =
    document.getElementById("fuzzy");

const limit =
    document.getElementById("limit");

const queryBtn =
    document.getElementById("queryBtn");

const clearBtn =
    document.getElementById("clearBtn");

const copyBtn =
    document.getElementById("copyBtn");

const exportBtn =
    document.getElementById("exportBtn");

const queryStatus =
    document.getElementById("queryStatus");

const queryCount =
    document.getElementById("queryCount");

const matchCount =
    document.getElementById("matchCount");

const noMatchCount =
    document.getElementById("noMatchCount");

const resultBody =
    document.getElementById("resultBody");

const logoutBtn =
    document.getElementById("logoutBtn");


/* =========================================================
   当前查询结果
========================================================= */

let currentResults = [];


/* =========================================================
   HTML 转义
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   查询
========================================================= */

queryBtn.addEventListener(
    "click",
    async function () {

        const text =
            queryInput.value.trim();

        if (!text) {

            queryStatus.textContent =
                "请输入表身号或 IMEI";

            return;
        }


        const token = getToken();

        if (!token) {

            window.location.replace("index.html");

            return;
        }


        queryStatus.textContent =
            "正在查询...";

        queryBtn.disabled = true;


        try {

            /*
             * 使用你原来的 Flask API
             * 正确接口：
             *
             * POST /api/search
             *
             * 认证：
             *
             * Authorization: Bearer token
             */

            const response =
                await fetch(
                    API_BASE + "/api/search",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        },

                        body: JSON.stringify({

                            query: text,

                            fuzzy:
                                fuzzy.checked,

                            limit:
                                Math.min(
                                    Math.max(
                                        Number(limit.value) || 200,
                                        1
                                    ),
                                    1000
                                )
                        })
                    }
                );


            const data =
                await response.json();


            /* 登录过期 */

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                sessionStorage.removeItem(
                    "suiwater_token"
                );

                alert(
                    "登录已过期，请重新登录"
                );

                window.location.replace(
                    "index.html"
                );

                return;
            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    ("HTTP " + response.status)
                );
            }


            /* 保存结果 */

            currentResults =
                data.results || [];


            /* 统计 */

            queryCount.textContent =
                data.total || 0;

            matchCount.textContent =
                data.found || 0;

            noMatchCount.textContent =
                data.not_found || 0;


            /* 显示结果 */

            renderResults(
                currentResults
            );


            queryStatus.textContent =
                `查询完成，共返回 ${currentResults.length} 条`;


        } catch (error) {

            console.error(
                "查询错误:",
                error
            );

            queryStatus.textContent =
                "查询失败：" +
                error.message;


        } finally {

            queryBtn.disabled = false;

        }

    }
);


/* =========================================================
   渲染结果
========================================================= */

function renderResults(results) {

    resultBody.innerHTML = "";


    if (
        !results ||
        results.length === 0
    ) {

        resultBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    暂无匹配结果
                </td>
            </tr>
        `;

        return;
    }


    results.forEach(
        (row, index) => {

            const tr =
                document.createElement("tr");


            const queryType =
                row.query_type ??
                row["查询类型"] ??
                row.type ??
                "";


            const meter =
                row.meter_no ??
                row["表身号"] ??
                row.meter ??
                "";


            const imei =
                row.imei ??
                row["IMEI"] ??
                "";


            const owner =
                row.owner ??
                row["厂家归属"] ??
                row.factory ??
                "";


            const status =
                row.status ??
                row["状态"] ??
                "";


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(queryType)}
                </td>

                <td>
                    ${escapeHtml(meter)}
                </td>

                <td>
                    ${escapeHtml(imei)}
                </td>

                <td>
                    ${escapeHtml(owner || "-")}
                </td>

                <td
                    class="${
                        status === "已找到"
                            ? "ok"
                            : "no"
                    }"
                >
                    ${escapeHtml(status || "未匹配")}
                </td>

            `;


            resultBody.appendChild(tr);

        }
    );

}


/* =========================================================
   清空
========================================================= */

clearBtn.addEventListener(
    "click",
    function () {

        queryInput.value = "";


        currentResults = [];


        queryCount.textContent = "0";

        matchCount.textContent = "0";

        noMatchCount.textContent = "0";


        queryStatus.textContent =
            "等待查询";


        resultBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    暂无查询结果
                </td>
            </tr>
        `;

    }
);


/* =========================================================
   复制结果
========================================================= */

copyBtn.addEventListener(
    "click",
    async function () {

        if (
            !currentResults.length
        ) {

            queryStatus.textContent =
                "暂无结果可复制";

            return;
        }


        const header =
            "序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态";


        const rows =
            currentResults.map(
                (row, index) => {

                    const queryType =
                        row.query_type ??
                        row["查询类型"] ??
                        row.type ??
                        "";


                    const meter =
                        row.meter_no ??
                        row["表身号"] ??
                        row.meter ??
                        "";


                    const imei =
                        row.imei ??
                        row["IMEI"] ??
                        "";


                    const owner =
                        row.owner ??
                        row["厂家归属"] ??
                        row.factory ??
                        "";


                    const status =
                        row.status ??
                        row["状态"] ??
                        "";


                    return [

                        index + 1,

                        queryType,

                        meter,

                        imei,

                        owner,

                        status

                    ].join("\t");

                }
            );


        try {

            await navigator.clipboard.writeText(
                [
                    header,
                    ...rows
                ].join("\n")
            );


            queryStatus.textContent =
                "结果已复制";


        } catch (error) {

            queryStatus.textContent =
                "复制失败";

        }

    }
);


/* =========================================================
   导出 Excel
========================================================= */

exportBtn.addEventListener(
    "click",
    async function () {

        if (
            !currentResults.length
        ) {

            queryStatus.textContent =
                "暂无结果可导出";

            return;
        }


        const token = getToken();

        if (!token) {

            window.location.replace(
                "index.html"
            );

            return;
        }


        exportBtn.disabled = true;

        exportBtn.textContent =
            "⏳ 导出中...";


        queryStatus.textContent =
            "正在生成 Excel，请稍候...";


        try {

            const response =
                await fetch(
                    API_BASE + "/api/export",
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        },

                        body: JSON.stringify({

                            results:
                                currentResults

                        })
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                sessionStorage.removeItem(
                    "suiwater_token"
                );

                alert(
                    "登录已过期，请重新登录"
                );

                window.location.replace(
                    "index.html"
                );

                return;
            }


            if (!response.ok) {

                let data = {};

                try {

                    data =
                        await response.json();

                } catch (e) {}

                throw new Error(
                    data.message ||
                    "导出失败"
                );
            }


            const blob =
                await response.blob();


            const url =
                URL.createObjectURL(blob);


            const a =
                document.createElement("a");


            a.href = url;

            a.download =
                "穗水表身号查询结果.xlsx";


            document.body.appendChild(a);

            a.click();

            a.remove();


            setTimeout(
                () => {
                    URL.revokeObjectURL(url);
                },
                1000
            );


            queryStatus.textContent =
                "Excel 导出完成";


        } catch (error) {

            console.error(error);

            queryStatus.textContent =
                "导出失败：" +
                error.message;


        } finally {

            exportBtn.disabled = false;

            exportBtn.textContent =
                "导出 Excel";

        }

    }
);


/* =========================================================
   退出登录
========================================================= */

logoutBtn.addEventListener(
    "click",
    function () {

        sessionStorage.removeItem(
            "suiwater_token"
        );

        window.location.replace(
            "index.html"
        );

    }
);


/* =========================================================
   Ctrl + Enter 查询
========================================================= */

queryInput.addEventListener(
    "keydown",
    function (e) {

        if (
            e.ctrlKey &&
            e.key === "Enter"
        ) {

            e.preventDefault();

            queryBtn.click();

        }

    }
);


/* =========================================================
   页面打开检查登录
========================================================= */

checkLogin();

</script>
</body>
