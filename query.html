<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>穗水表身号查询系统</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="wrap">

    <!-- =========================
         顶部
    ========================== -->
    <div class="header">

        <div>
            <h1>💧 穗水表身号查询系统</h1>
            <div class="sub">
                水表信息快速查询与数据管理
            </div>
        </div>

        <div>
            <span class="status">
                <span class="ok">●</span>
                API 服务正常
            </span>

            <button class="logout" id="logoutBtn">
                退出登录
            </button>
        </div>

    </div>


    <!-- =========================
         查询区域
    ========================== -->
    <div class="card">

        <h3>统一查询</h3>

        <textarea
            id="queryInput"
            placeholder="请输入表身号，每行一个&#10;&#10;例如：&#10;123456789&#10;987654321"></textarea>

        <div class="tip">
            支持一次输入多个表身号，每行一个。
            开启模糊查询后，可匹配包含查询内容的表身号。
        </div>


        <!-- 查询选项 -->
        <div class="opts">

            <label>
                <input type="checkbox" id="fuzzy">
                开启模糊查询
            </label>

            <label>
                最多返回
                <select id="limit" class="limit">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                </select>
                条
            </label>

        </div>


        <!-- 操作按钮 -->
        <div class="actions">

            <button
                type="button"
                id="queryBtn"
                class="p">
                查询
            </button>

            <button
                type="button"
                id="clearBtn"
                class="secondary">
                清空
            </button>

            <button
                type="button"
                id="copyBtn"
                class="secondary">
                复制结果
            </button>

            <button
                type="button"
                id="exportBtn"
                class="s">
                导出 Excel
            </button>

            <span
                class="status"
                id="queryStatus">
                等待查询
            </span>

        </div>

    </div>


    <!-- =========================
         统计卡片
    ========================== -->
    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                查询数量
            </div>

            <div
                class="num"
                id="queryCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                匹配数量
            </div>

            <div
                class="num"
                id="matchCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                未匹配数量
            </div>

            <div
                class="num"
                id="noMatchCount">
                0
            </div>

        </div>

    </div>


    <!-- =========================
         查询结果
    ========================== -->
    <div class="card result-card">

        <h3>查询结果</h3>

        <div class="scroll">

            <table id="resultTable">

                <thead>

                    <tr>
                        <th>序号</th>
                        <th>查询类型</th>
                        <th>表身号</th>
                        <th>IMEI</th>
                        <th>厂家归属</th>
                        <th>状态</th>
                    </tr>

                </thead>

                <tbody id="resultBody">

                    <tr>
                        <td
                            colspan="6"
                            class="empty">
                            暂无查询结果
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>


<script>

/* =========================
   元素
========================= */

const queryInput = document.getElementById("queryInput");
const fuzzy = document.getElementById("fuzzy");
const limit = document.getElementById("limit");

const queryBtn = document.getElementById("queryBtn");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");
const exportBtn = document.getElementById("exportBtn");

const queryStatus = document.getElementById("queryStatus");

const queryCount = document.getElementById("queryCount");
const matchCount = document.getElementById("matchCount");
const noMatchCount = document.getElementById("noMatchCount");

const resultBody = document.getElementById("resultBody");

const logoutBtn = document.getElementById("logoutBtn");


/* =========================
   当前查询结果
========================= */

let currentResults = [];


/* =========================
   查询
========================= */

queryBtn.addEventListener("click", async function () {

    const text = queryInput.value.trim();

    if (!text) {

        queryStatus.textContent = "请输入表身号";

        return;
    }


    const values = text
        .split(/\r?\n/)
        .map(v => v.trim())
        .filter(Boolean);


    queryStatus.textContent = "正在查询...";

    queryBtn.disabled = true;


    try {

        /*
         * 注意：
         * 这里需要使用你原来的 Flask API。
         *
         * 当前只是 UI 模板，
         * 不建议直接覆盖你现有 query.html 中的 API 查询代码。
         */

        const response = await fetch("/api/query", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                values: values,

                fuzzy: fuzzy.checked,

                limit: Number(limit.value)

            })

        });


        if (!response.ok) {
            throw new Error("查询失败");
        }


        const data = await response.json();


        currentResults =
            Array.isArray(data)
                ? data
                : (data.results || []);


        renderResults(currentResults);


        queryCount.textContent = values.length;

        matchCount.textContent = currentResults.length;

        noMatchCount.textContent =
            Math.max(
                0,
                values.length - currentResults.length
            );


        queryStatus.textContent =
            `查询完成，共返回 ${currentResults.length} 条`;


    } catch (error) {

        console.error(error);

        queryStatus.textContent =
            "查询失败，请检查 API 服务";


    } finally {

        queryBtn.disabled = false;

    }

});


/* =========================
   渲染结果
========================= */

function renderResults(results) {

    resultBody.innerHTML = "";


    if (!results || results.length === 0) {

        resultBody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    暂无匹配结果
                </td>
            </tr>
        `;

        return;
    }


    results.forEach((row, index) => {

        const tr = document.createElement("tr");


        const queryType =
            row["查询类型"] ??
            row.query_type ??
            row.type ??
            "";


        const meter =
            row["表身号"] ??
            row.meter_no ??
            row.meter ??
            "";


        const imei =
            row["IMEI"] ??
            row.imei ??
            "";


        const factory =
            row["厂家归属"] ??
            row.factory ??
            "";


        const status =
            row["状态"] ??
            row.status ??
            "";


        tr.innerHTML = `

            <td>${index + 1}</td>

            <td>${escapeHtml(queryType)}</td>

            <td>${escapeHtml(meter)}</td>

            <td>${escapeHtml(imei)}</td>

            <td>${escapeHtml(factory)}</td>

            <td>
                ${
                    status
                    ? `<span class="ok">${escapeHtml(status)}</span>`
                    : `<span class="no">未匹配</span>`
                }
            </td>

        `;


        resultBody.appendChild(tr);

    });

}


/* =========================
   清空
========================= */

clearBtn.addEventListener("click", function () {

    queryInput.value = "";

    resultBody.innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                暂无查询结果
            </td>
        </tr>
    `;

    queryCount.textContent = "0";
    matchCount.textContent = "0";
    noMatchCount.textContent = "0";

    queryStatus.textContent = "等待查询";

    currentResults = [];

});


/* =========================
   复制结果
========================= */

copyBtn.addEventListener("click", async function () {

    if (!currentResults.length) {

        queryStatus.textContent = "暂无结果可复制";

        return;
    }


    const header =
        "序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态";


    const rows = currentResults.map((row, index) => {

        return [

            index + 1,

            row["查询类型"] ??
            row.query_type ??
            row.type ??
            "",

            row["表身号"] ??
            row.meter_no ??
            row.meter ??
            "",

            row["IMEI"] ??
            row.imei ??
            "",

            row["厂家归属"] ??
            row.factory ??
            "",

            row["状态"] ??
            row.status ??
            ""

        ].join("\t");

    });


    try {

        await navigator.clipboard.writeText(
            [header, ...rows].join("\n")
        );

        queryStatus.textContent = "结果已复制";

    } catch (error) {

        queryStatus.textContent = "复制失败";

    }

});


/* =========================
   导出 Excel
========================= */

exportBtn.addEventListener("click", function () {

    if (!currentResults.length) {

        queryStatus.textContent = "暂无结果可导出";

        return;
    }


    /*
     * 这里同样应该接入你原来的
     * Flask Excel 导出接口。
     */

    window.location.href = "/api/export";

});


/* =========================
   退出登录
========================= */

logoutBtn.addEventListener("click", function () {

    window.location.href = "/logout";

});


/* =========================
   HTML 转义
========================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
