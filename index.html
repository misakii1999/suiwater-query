<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>穗水表身号查询系统</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef5ff,#f8fbff);font-family:"Microsoft YaHei",Arial;color:#1f2937}.wrap{max-width:1200px;width:94%;margin:30px auto}.card,.stat{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.sub,.tip,.status{color:#777}.tip{font-size:13px;margin-top:8px;line-height:1.7}textarea{width:100%;height:175px;padding:15px;border:1px solid #d8dee8;border-radius:12px;font-size:15px;resize:vertical}.opts{display:flex;gap:22px;margin-top:14px;align-items:center;flex-wrap:wrap}.limit{width:75px;padding:5px;border:1px solid #ddd;border-radius:6px}button{padding:10px 20px;border:0;border-radius:9px;margin:12px 8px 0 0;cursor:pointer}.p{background:#2563eb;color:#fff}.s{background:#16a34a;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{margin:0}.num{font-size:26px;font-weight:bold;margin-top:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f5f7fa}.ok{color:#16a34a;font-weight:bold}.no{color:#d33;font-weight:bold}.empty{text-align:center;color:#999;padding:40px}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style>
<div class="wrap"><div class="card head"><div><h1>穗水表身号查询系统</h1><div class="sub">表身号 / IMEI 统一查询 · 精确 · 模糊 · 批量</div></div></div>
<div class="card"><h3>统一查询</h3><textarea id=q placeholder="请输入表身号或 IMEI

支持 Excel 一列直接粘贴；多个号码可换行、空格、逗号、分号分隔。"></textarea><div class=tip>精确查询自动判断表身号或 IMEI；开启模糊查询后同时搜索两个字段。</div>
<div class=opts><label><input type=checkbox id=fuzzy> 开启模糊查询</label><span>最多返回 <input class=limit id=limit type=number min=1 max=1000 value=200> 条</span></div>
<button class=p onclick=searchData()>🔍 查询</button><button onclick=clearAll()>清空</button><button onclick=copyResults()>复制结果</button><button class=s onclick=exportExcel()>导出 Excel</button><div class=status id=status>就绪</div></div>
<div class=stats><div class=stat>查询结果<div class=num id=t>0</div></div><div class=stat>查询成功<div class=num id=f>0</div></div><div class=stat>未找到<div class=num id=n>0</div></div></div>
<div class=card><h3>查询结果</h3><div class=scroll id=r><div class=empty>暂无查询结果</div></div></div></div>
<script>
const API_BASE="https://sg.oixvideos.top";
const API_KEY="SuiWater-8925-02147039-89";

let rows=[];

const esc=x=>{
    let d=document.createElement("div");
    d.textContent=x??"";
    return d.innerHTML;
};

async function searchData() {
    let text = q.value.trim();

    if (!text) {
        return alert("请输入表身号或 IMEI");
    }

    status.textContent = "正在查询，请稍候...";

    const btn = document.querySelector(".p");
    btn.disabled = true;
    btn.textContent = "⏳ 查询中...";

    try {
        let x = await fetch(API_BASE + "/api/search", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-Key": API_KEY
            },
            body: JSON.stringify({
                query: text,
                fuzzy: fuzzy.checked,
                limit: Math.min(
                        Math.max(Number(limit.value) || 200, 1),
                        1000
                )
            })
        });

        let d = await x.json();

        if (!x.ok || !d.success) {
            throw Error(d.message || ("HTTP " + x.status));
        }

        rows = d.results || [];

        t.textContent = d.total || 0;
        f.textContent = d.found || 0;
        n.textContent = d.not_found || 0;

        render();

        status.textContent = "查询完成，共 " + rows.length + " 条";

    } catch (e) {

        status.textContent = "查询失败：" + e.message;

    } finally {

        btn.disabled = false;
        btn.textContent = "🔍 查询";
    }
}
function render(){if(!rows.length){r.innerHTML='<div class=empty>暂无查询结果</div>';return}let h="<table><tr><th>序号</th><th>查询类型</th><th>表身号</th><th>IMEI</th><th>厂家归属</th><th>状态</th></tr>";rows.forEach((x,i)=>h+=`<tr><td>${i+1}</td><td>${esc(x.query_type)}</td><td>${esc(x.meter_no)}</td><td>${esc(x.imei)}</td><td>${esc(x.owner||"-")}</td><td class=${x.status=="已找到"?"ok":"no"}>${esc(x.status)}</td></tr>`);r.innerHTML=h+"</table>"}
function clearAll(){q.value="";rows=[];t.textContent=f.textContent=n.textContent="0";r.innerHTML='<div class=empty>暂无查询结果</div>';status.textContent="就绪"}
async function copyResults(){if(!rows.length)return alert("没有查询结果");await navigator.clipboard.writeText(["序号\t查询类型\t表身号\tIMEI\t厂家归属\t状态",...rows.map((x,i)=>`${i+1}\t${x.query_type}\t${x.meter_no}\t${x.imei}\t${x.owner}\t${x.status}`)].join("\n"));alert("已复制")}
async function exportExcel(){if(!rows.length)return alert("没有可导出的数据");let x=await fetch(API_BASE+"/api/export",{method:"POST",headers:{"Content-Type":"application/json","X-API-Key":API_KEY},body:JSON.stringify({results:rows})});if(!x.ok)return alert("导出失败");let b=await x.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="穗水表身号查询结果.xlsx";a.click();URL.revokeObjectURL(u)}
q.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key=="Enter")searchData()});
</script>
